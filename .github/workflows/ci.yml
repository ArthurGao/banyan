name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Integration tests use schema banyan_test and fail (never skip) without BANYAN_TEST_DATABASE_URL.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: banyan
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: banyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banyan -d banyan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BANYAN_TEST_DATABASE_URL: postgresql+asyncpg://banyan:ci@localhost:5432/banyan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv has no moving v10 tag
        with:
          version: "0.10.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend
      - run: uv sync --locked   # Python from backend/.python-version
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      # Includes the frontend/openapi.json drift check; a skipped test fails the run (CI=true).
      - run: uv run pytest -v

  contract:
    # The steward contract spike on steward's embedded mode: in-process, fake embedder, no models.
    # The KB-first end-to-end test (B3) also needs Banyan's database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: banyan
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: banyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banyan -d banyan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BANYAN_TEST_DATABASE_URL: postgresql+asyncpg://banyan:ci@localhost:5432/banyan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: contract   # its own cache: the steward git deps are much heavier
      - run: uv sync --locked --group contract
      - run: uv run pytest -v -m steward

  frontend:
    runs-on: ubuntu-latest
    # e2e runs the real backend with fakes (frontend/e2e/serve.sh) on schema banyan_e2e.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: banyan
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: banyan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banyan -d banyan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BANYAN_DATABASE_URL: postgresql+asyncpg://banyan:ci@localhost:5432/banyan
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend
      - run: pnpm install --frozen-lockfile
      # The generated types must match the committed openapi.json.
      - run: pnpm gen:api && git diff --exit-code -- src/api/generated
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: uv sync --locked
        working-directory: backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
