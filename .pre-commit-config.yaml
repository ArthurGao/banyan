# Install: uv run --project backend pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run --directory backend ruff format --check
        language: system
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        entry: uv run --directory backend lint-imports
        language: system
        files: ^backend/
        pass_filenames: false
